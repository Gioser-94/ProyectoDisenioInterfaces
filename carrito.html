<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cesta</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>
<body>
    <header class="header">
        <a href="./index.html">
            <div class="logo">
                <img class="logo-part cara" src="./img/logo-cara.png" alt="logo-cara">
                <img class="logo-part mando" src="./img/logo-mando.png" alt="logo-mando">
                <img class="logo-part titulo" src="./img/logo-titulo.png" alt="logo-titulo">
            </div>
        </a>

    <button class="btn-menu">MENU</button>

    <div class="search">
      <div class="search-box">
        <input type="text" placeholder="Buscar..." />
        <button class="search-btn">🔍</button>
      </div>
    </div>

    <nav class="icons">
        <a href="carrito.html">🛒</a>
        <a href="login.html">👤</a>
    </nav>
</header>
<main class="carrito">

    <section class="cesta">
        <h2>Cesta</h2>
        <div class="caja-cesta">
            <p class="vacia">La cesta está vacía</p>
            <p>Tu carrito está vacío por ahora. ¡Explora nuestras secciones!</p>
            <button>EXPLORAR JUEGOS</button>
        </div>
    </section>

    <aside class="resumen">
        <h2>Resumen</h2>
        <p>Precio oficial: 0€</p>
        <p>Descuento: 0€</p>
        <p>Total: 0€</p>
        <button>SIGUIENTE</button>
    </aside>

</main>
    <footer class="footer">
        <p>© 2025 Fatiga Visual</p>
        <div class="rrss">
            <span>📘</span>
            <span>📸</span>
            <span>🐦</span>
        </div>
    </footer>
</body>
</html>
