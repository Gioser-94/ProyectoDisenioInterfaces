<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Cuenta</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
    <header class="header">
        <a href="./index.html">
            <div class="logo">
                <img class="logo-part cara" src="./img/logo-cara.png" alt="logo-cara">
                <img class="logo-part mando" src="./img/logo-mando.png" alt="logo-mando">
                <img class="logo-part titulo" src="./img/logo-titulo.png" alt="logo-titulo">
            </div>
        </a>

        <button class="btn-menu">MENU</button>

        <div class="search">
            <div class="search-box">
                <input type="text" placeholder="Buscar..." />
                <button class="search-btn">🔍</button>
            </div>
        </div>

        <nav class="icons">
            <a href="carrito.html">🛒</a>
            <a href="login.html">👤</a>
        </nav>
    </header>

<main class="cuenta">

    <section class="perfil">

        <div class="foto-perfil">
            <img src="img/user.png">
        </div>

        <form class="datos-personales">
            <label>NOMBRE:</label>
            <input type="text">

            <label>APELLIDO:</label>
            <input type="text">

            <label>FECHA NACIMIENTO:</label>
            <input type="date">

            <label>DIRECCIÓN:</label>
            <input type="text">
        </form>
    </section>

    <aside class="menu-cuenta">
        <h2>Mi Cuenta</h2>
        <ul>
            <li>Mis Datos</li>
            <li>Mis direcciones</li>
            <li>Mis documentos</li>
            <li>Opiniones</li>
            <li>Lista de deseados</li>
        </ul>

        <h2>Pedidos y devoluciones</h2>
        <ul>
            <li>Pedidos, devoluciones y facturas</li>
            <li>Pedidos cancelados</li>
            <li>Historial de devoluciones</li>
            <li>Productos digitales</li>
            <li>Área de seguros</li>
        </ul>

        <button class="cerrar-sesion">Cerrar sesión</button>
    </aside>

</main>
    <footer class="footer">
        <p>© 2025 Fatiga Visual</p>
        <div class="rrss">
            <span>📘</span>
            <span>📸</span>
            <span>🐦</span>
        </div>
    </footer>
</body>
</html>
