<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión o Registro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="login.js"></script>
</head>
<body>
    <header class="header">
        <a href="./index.html">
            <div class="logo">
                <img src="img/logoPrincipal.png" alt="Fatiga Visual" />
            </div>
        </a>

        <button class="btn-menu">MENU</button>

        <div class="search">
            <input type="text" placeholder="Buscar...">
            <button class="search-btn">🔍</button>
        </div>

        <nav class="icons">
            <a href="carrito.html">🛒</a>
            <a href="login.html">👤</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Formulario Login -->
            <div class="form-box login">
                <form action="">
                    <h1>Login</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Nombre de usuario" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Contraseña" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div class="recuperar-pass">
                        <a href="#">¿Has olvidado la contraseña?</a>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
            
            <!-- Formulario Registro -->
            <div class="form-box registro">
                <form action="">
                    <h1>Registro</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Nombre de usuario" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Contraseña" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div class="input-box">
                        <input type="email" placeholder="ejemplo@email.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <button type="submit" class="btn">Registro</button>
                </form>
            </div>
            
            <!-- Alternar box -->
            <div class="alternar-box">
                <!-- Alternar box Left -->
                <div class="alternar-panel alternar-left">
                    <h1>¡Bienvenido!</h1>
                    <p>¿No tienes una cuenta?</p>
                    <button class="btn registro-btn">Registro</button>
                </div>

                <!-- Alternar box right -->
                <div class="alternar-panel alternar-right">
                    <h1>¡Bienvenido de nuevo!</h1>
                    <p>¿Ya tienes una cuenta?</p>
                    <button class="btn login-btn">Login</button>
                </div>
            </div>
        </div>
    </main>


    <footer class="footer">
    <p>© 2025 Fatiga Visual</p>
        <div class="rrss">
            <span>📘</span>
            <span>📸</span>
            <span>🐦</span>
        </div>
    </footer>
</body>
</html>
